# pyproject.toml

[project]
name = "keysight"
version = "2.0.0"
description = "Package for working with Keysight/Agilent test equipment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Matthew Rankin", email = "369937+matthewrankin@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = ["numpy>=2.2.0"]
classifiers = [
  'Programming Language :: Python',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Development Status :: 5 - Production/Stable',
  'Operating System :: OS Independent',
  'Intended Audience :: Developers',
  'Topic :: Software Development :: Libraries :: Python Modules',
]

[project.urls]
Homepage = "https://github.com/questrail/keysight"
Issues = "https://github.com/questrail/keysight/issues"

# Pinned to a minor range. Build backends are not part of uv.lock, so an
# unpinned backend is resolved fresh on every build, including the release run
# that produces the attested distributions; a range keeps that one input to
# the published wheel from moving on its own.
[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

# uv_build ships a minimal source distribution by default: the module, README,
# LICENSE, and pyproject.toml. hatchling had included everything git tracks, so
# these restore what the sdist carried before the backend changed, rather than
# quietly narrowing what is published. The tests and their sample data are the
# ones worth keeping: they are what lets anyone with the sdist alone check that
# the readers still parse the instrument files.
[tool.uv.build-backend]
source-include = [
  ".github/**",
  ".gitignore",
  ".python-version",
  "CHANGELOG.md",
  "Justfile",
  "scripts/**",
  "tests/**",
  "uv.lock",
]
# source-include is filesystem globs, not git's view of the tree, so anything
# sitting in those directories ships whether or not git tracks it. hatchling
# had built from what git tracks and left these out on its own.
source-exclude = ["**/.DS_Store"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Select rules explicitly rather than relying on ruff's defaults, so that the
# rule set is a deliberate choice. The ruff version itself is pinned by uv.lock.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "EXE", # flake8-executable
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "NPY", # numpy-specific rules
  "C4",  # flake8-comprehensions
  "FURB",# refurb
  "PERF",# perflint
  "RET", # flake8-return
  "ARG", # flake8-unused-arguments
  "PIE", # flake8-pie
  "ISC", # flake8-implicit-str-concat
  "RSE", # flake8-raise
  "A",   # flake8-builtins
  "N",   # pep8-naming
  "G",   # flake8-logging-format
  "LOG", # flake8-logging
  "Q",   # flake8-quotes
  "S",   # flake8-bandit
  "RUF", # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# S101 objects to `assert`, which is how a pytest suite states what it checks.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
# A numpy or stdlib deprecation is how this breaks across the 3.12 - 3.14 the
# classifiers claim. Left as a warning it scrolls past in a green run; as an
# error it fails the run that introduced it.
filterwarnings = ["error"]
# An xfail that starts passing is a test no longer checking what it says.
xfail_strict = true

[tool.coverage.run]
source = ["keysight"]
branch = true
# Coveralls maps the report onto the repository, and absolute paths from a
# runner's checkout directory are not something it can map.
relative_files = true

[tool.coverage.report]
show_missing = true
# exclude_also adds to coverage's built-in exclusions; exclude_lines would
# replace them, which means restating the pragma pattern to keep it working.
exclude_also = ["if TYPE_CHECKING:"]
# The suite covers every statement and branch. A floor set anywhere below that
# would let coverage fall without anything noticing; set here, uncovered code
# has to arrive with either a test or a deliberate edit to this line.
fail_under = 100

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "zizmor>=1.30.0",
]
